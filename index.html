<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e40af" />
<title>Mes Crédits</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mes%20Cr%C3%A9dits%22%2C%22short_name%22%3A%22Cr%C3%A9dits%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%231e40af%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527100%2527%2520fill%253D%2527%25231e40af%2527%252F%253E%253Ctext%2520x%253D%2527256%2527%2520y%253D%2527320%2527%2520font-size%253D%2527250%2527%2520text-anchor%253D%2527middle%2527%2520fill%253D%2527white%2527%253E%25E2%2582%25AC%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%2520maskable%22%7D%5D%7D" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  .modal-in { animation: modalIn .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes modalIn { from { opacity: 0; transform: scale(.9);} to {opacity:1; transform:scale(1);} }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body class="bg-gray-100 min-h-screen text-gray-900">

<!-- ========== ÉCRAN ACCUEIL ========== -->
<div id="app" class="max-w-xl mx-auto p-4 pb-40">

  <header class="flex items-center justify-between mb-4 pt-2">
    <h1 class="text-3xl font-bold text-blue-900">Mes crédits</h1>
    <button id="btnHistory"
      class="bg-blue-700 hover:bg-blue-800 active:scale-95 text-white text-lg font-semibold px-4 py-3 rounded-2xl shadow transition flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4"/>
      </svg>
      Historique
    </button>
  </header>

  <!-- Bouton Ajouter en haut de la liste -->
  <button id="btnAdd"
    class="w-full mb-4 bg-green-600 hover:bg-green-700 active:scale-[0.98] text-white text-2xl font-bold py-5 rounded-2xl shadow-lg transition flex items-center justify-center gap-3">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    Ajouter un crédit
  </button>

  <ul id="listCredits" class="space-y-3"></ul>

  <div id="emptyMsg" class="hidden text-center text-gray-500 text-xl mt-16">
    Aucun crédit pour le moment.<br>Appuyez sur <span class="font-bold text-green-700">+ Ajouter un crédit</span>.
  </div>
</div>

<!-- ========== BANDEAU TOTAL NON RÉGLÉ (fixe en bas) ========== -->
<div id="totalBanner"
  class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-full max-w-xl px-4 z-30 pointer-events-none">
  <div class="bg-red-700 text-white rounded-2xl shadow-2xl px-5 py-4 flex items-center justify-between pointer-events-auto">
    <div>
      <div class="text-sm font-semibold text-red-100 uppercase tracking-wide">Reste à payer</div>
      <div id="totalCount" class="text-xs text-red-200"></div>
    </div>
    <span id="totalValue" class="num text-3xl font-bold">0,00 €</span>
  </div>
</div>

<!-- ========== ÉCRAN HISTORIQUE ========== -->
<div id="historyView" class="hidden fixed inset-0 bg-gray-100 z-30 overflow-y-auto">
  <div class="max-w-xl mx-auto p-4 pb-10">

    <header class="flex items-center justify-between mb-6 pt-2">
      <button id="btnBack"
        class="bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-900 text-lg font-semibold px-4 py-3 rounded-2xl shadow transition flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Retour
      </button>
      <h2 class="text-2xl font-bold text-blue-900">Historique</h2>
      <button id="btnClearHistory"
        class="bg-red-600 hover:bg-red-700 active:scale-95 text-white text-base font-semibold px-4 py-3 rounded-2xl shadow transition">
        Effacer
      </button>
    </header>

    <div id="historyTotal" class="hidden mb-5 bg-blue-900 text-white rounded-2xl px-5 py-4 flex items-center justify-between shadow">
      <div>
        <div class="text-lg font-semibold">Total réglé</div>
        <div id="historyCount" class="text-sm text-blue-200"></div>
      </div>
      <span id="historyTotalValue" class="num text-2xl font-bold">0,00 €</span>
    </div>

    <div id="historyGroups" class="space-y-4"></div>

    <div id="emptyHistory" class="hidden text-center text-gray-500 text-xl mt-16">
      Aucun règlement enregistré.
    </div>
  </div>
</div>

<!-- ========== MODALE CONFIRMATION ========== -->
<div id="modalConfirm" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm modal-in">
    <h3 id="modalTitle" class="text-2xl font-bold text-gray-900 mb-3 text-center">Confirmer ?</h3>
    <p id="modalText" class="text-lg text-gray-700 text-center mb-6">Es-tu sûr ?</p>
    <div class="flex gap-3">
      <button id="modalCancel"
        class="flex-1 bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-900 text-xl font-bold py-4 rounded-2xl transition">
        Annuler
      </button>
      <button id="modalOk"
        class="flex-1 bg-blue-700 hover:bg-blue-800 active:scale-95 text-white text-xl font-bold py-4 rounded-2xl transition">
        Confirmer
      </button>
    </div>
  </div>
</div>

<!-- ========== ASSISTANT D'AJOUT (3 ÉTAPES) ========== -->
<div id="modalWizard" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm modal-in">
    <div class="flex justify-center gap-2 mb-5">
      <div id="dot1" class="w-3 h-3 rounded-full bg-blue-700"></div>
      <div id="dot2" class="w-3 h-3 rounded-full bg-gray-300"></div>
      <div id="dot3" class="w-3 h-3 rounded-full bg-gray-300"></div>
    </div>

    <div id="step1">
      <h3 class="text-2xl font-bold text-gray-900 mb-4 text-center">Nom ?</h3>
      <input id="inputName" type="text" placeholder="Ex : Épicerie"
        class="w-full text-2xl border-2 border-gray-300 rounded-2xl px-4 py-4 mb-5 focus:outline-none focus:border-blue-600" />
    </div>

    <div id="step2" class="hidden">
      <h3 class="text-2xl font-bold text-gray-900 mb-4 text-center">Montant ?</h3>
      <input id="inputAmount" type="number" inputmode="decimal" placeholder="0"
        class="w-full text-2xl border-2 border-gray-300 rounded-2xl px-4 py-4 mb-5 focus:outline-none focus:border-blue-600" />
    </div>

    <div id="step3" class="hidden">
      <h3 class="text-2xl font-bold text-gray-900 mb-4 text-center">Note ?</h3>
      <input id="inputNote" type="text" placeholder="(facultatif)"
        class="w-full text-2xl border-2 border-gray-300 rounded-2xl px-4 py-4 mb-5 focus:outline-none focus:border-blue-600" />
    </div>

    <div class="flex gap-3">
      <button id="wizCancel"
        class="flex-1 bg-gray-200 hover:bg-gray-300 active:scale-95 text-gray-900 text-xl font-bold py-4 rounded-2xl transition">
        Annuler
      </button>
      <button id="wizNext"
        class="flex-1 bg-blue-700 hover:bg-blue-800 active:scale-95 text-white text-xl font-bold py-4 rounded-2xl transition">
        Suivant
      </button>
    </div>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="hidden fixed bottom-28 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-lg font-semibold px-6 py-3 rounded-2xl shadow-xl z-50"></div>

<script>
/* =========================================================
   STOCKAGE
   ========================================================= */
const STORAGE_KEY = 'mesCredits_v1';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { credits: [], history: [] };
    const d = JSON.parse(raw);
    return { credits: d.credits || [], history: d.history || [] };
  } catch(e) {
    return { credits: [], history: [] };
  }
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
let state = loadData();

/* =========================================================
   UTILITAIRES
   ========================================================= */
function formatPrice(n) {
  const v = Number(n) || 0;
  return v.toFixed(2).replace('.', ',') + ' €';
}
function formatDateLong(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const sameDay = (a,b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Aujourd'hui";
  if (sameDay(d, yest)) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function formatDateShort(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function formatTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function dateKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(() => t.classList.add('hidden'), 1800);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

/* =========================================================
   RENDU ACCUEIL
   - bouton Réglé tout à gauche
   - nom + sous-ligne au centre
   - montant à droite
   ========================================================= */
const listCredits = document.getElementById('listCredits');
const emptyMsg = document.getElementById('emptyMsg');

function renderCredits() {
  listCredits.innerHTML = '';
  if (state.credits.length === 0) {
    emptyMsg.classList.remove('hidden');
  } else {
    emptyMsg.classList.add('hidden');
  }

  state.credits.forEach(c => {
    const li = document.createElement('li');
    li.className = 'bg-white rounded-2xl shadow px-3 py-3 flex items-center gap-3 fade-in';

    li.innerHTML = `
      <button data-id="${c.id}"
        class="btn-paid shrink-0 bg-green-600 hover:bg-green-700 active:scale-95 text-white text-sm font-bold px-3 py-3 rounded-xl shadow transition leading-tight text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mx-auto mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        Réglé
      </button>

      <div class="min-w-0 flex-1">
        <div class="text-xl font-bold text-gray-900 truncate">${escapeHtml(c.name)}</div>
        <div class="text-xs text-gray-400 mt-0.5">
          ${formatDateShort(c.createdAt)} · ${formatTime(c.createdAt)}
          ${c.note ? ` · <span class="italic text-gray-500">${escapeHtml(c.note)}</span>` : ''}
        </div>
      </div>

      <div class="num shrink-0 text-xl font-bold text-gray-900 text-right min-w-[100px]">
        ${formatPrice(c.amount)}
      </div>
    `;
    listCredits.appendChild(li);
  });

  listCredits.querySelectorAll('.btn-paid').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const credit = state.credits.find(x => x.id === id);
      if (!credit) return;
      openConfirm(
        'Marquer comme réglé ?',
        `${credit.name} — ${formatPrice(credit.amount)}`,
        () => markAsPaid(id)
      );
    });
  });

  renderTotalBanner();
}

/* =========================================================
   BANDEAU TOTAL NON RÉGLÉ
   ========================================================= */
const totalBanner = document.getElementById('totalBanner');
const totalValue = document.getElementById('totalValue');
const totalCount = document.getElementById('totalCount');

function renderTotalBanner() {
  if (state.credits.length === 0) {
    totalBanner.classList.add('hidden');
    return;
  }
  totalBanner.classList.remove('hidden');

  const total = state.credits.reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const n = state.credits.length;

  totalValue.textContent = formatPrice(total);
  totalCount.textContent = n + (n > 1 ? ' crédits en attente' : ' crédit en attente');
}

/* =========================================================
   MARQUER COMME RÉGLÉ
   ========================================================= */
function markAsPaid(id) {
  const idx = state.credits.findIndex(c => c.id === id);
  if (idx === -1) return;
  const credit = state.credits[idx];
  credit.paidAt = new Date().toISOString();
  state.history.unshift(credit);
  state.credits.splice(idx, 1);
  saveData();
  renderCredits();
  renderHistory();
  showToast('Crédit réglé ✓');
}

/* =========================================================
   RENDU HISTORIQUE COMPACT
   ========================================================= */
const historyGroups = document.getElementById('historyGroups');
const emptyHistory = document.getElementById('emptyHistory');
const historyTotal = document.getElementById('historyTotal');
const historyTotalValue = document.getElementById('historyTotalValue');
const historyCount = document.getElementById('historyCount');

function renderHistory() {
  historyGroups.innerHTML = '';

  if (state.history.length === 0) {
    emptyHistory.classList.remove('hidden');
    historyTotal.classList.add('hidden');
    return;
  }
  emptyHistory.classList.add('hidden');
  historyTotal.classList.remove('hidden');

  const total = state.history.reduce((s, h) => s + (Number(h.amount) || 0), 0);
  historyTotalValue.textContent = formatPrice(total);
  historyCount.textContent = state.history.length + (state.history.length > 1 ? ' règlements' : ' règlement');

  const groups = {};
  state.history
    .slice()
    .sort((a, b) => new Date(b.paidAt) - new Date(a.paidAt))
    .forEach(h => {
      const k = dateKey(h.paidAt);
      if (!groups[k]) groups[k] = [];
      groups[k].push(h);
    });

  const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  sortedKeys.forEach(key => {
    const items = groups[key];
    const dayTotal = items.reduce((s, h) => s + (Number(h.amount) || 0), 0);

    const section = document.createElement('section');

    const header = document.createElement('div');
    header.className = 'flex items-baseline justify-between px-1 mb-1.5';
    header.innerHTML = `
      <span class="text-sm font-bold text-blue-900 uppercase tracking-wide">
        ${escapeHtml(formatDateLong(items[0].paidAt))}
      </span>
      <span class="num text-xs font-semibold text-gray-500">
        ${items.length} · ${formatPrice(dayTotal)}
      </span>
    `;
    section.appendChild(header);

    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl shadow overflow-hidden divide-y divide-gray-100';

    items.forEach(h => {
      const row = document.createElement('div');
      row.className = 'px-3 py-2.5 fade-in';

      row.innerHTML = `
        <div class="flex items-center gap-2.5">
          <div class="shrink-0 w-7 h-7 rounded-full bg-green-100 text-green-700 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          </div>

          <div class="min-w-0 flex-1">
            <div class="text-base font-bold text-gray-900 truncate leading-tight">
              ${escapeHtml(h.name)}
              ${h.note ? `<span class="font-normal italic text-gray-500"> — ${escapeHtml(h.note)}</span>` : ''}
            </div>
            <div class="text-[11px] text-gray-500 mt-0.5 num">
              Ajout ${formatDateShort(h.createdAt)} ${formatTime(h.createdAt)}
              <span class="text-gray-300 mx-1">→</span>
              Réglé ${formatTime(h.paidAt)}
            </div>
          </div>

          <div class="num shrink-0 text-base font-bold text-gray-900 text-right min-w-[80px]">
            ${formatPrice(h.amount)}
          </div>
        </div>
      `;
      card.appendChild(row);
    });

    section.appendChild(card);
    historyGroups.appendChild(section);
  });
}

/* =========================================================
   MODALE CONFIRMATION
   ========================================================= */
const modalConfirm = document.getElementById('modalConfirm');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalOk = document.getElementById('modalOk');
const modalCancel = document.getElementById('modalCancel');

let confirmCallback = null;

function openConfirm(title, text, onOk) {
  modalTitle.textContent = title;
  modalText.textContent = text;
  confirmCallback = onOk;
  modalConfirm.classList.remove('hidden');
}
function closeConfirm() {
  modalConfirm.classList.add('hidden');
  confirmCallback = null;
}
modalCancel.addEventListener('click', closeConfirm);
modalOk.addEventListener('click', () => {
  const cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
});

/* =========================================================
   ASSISTANT D'AJOUT
   ========================================================= */
const modalWizard = document.getElementById('modalWizard');
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');
const dot1 = document.getElementById('dot1');
const dot2 = document.getElementById('dot2');
const dot3 = document.getElementById('dot3');
const inputName = document.getElementById('inputName');
const inputAmount = document.getElementById('inputAmount');
const inputNote = document.getElementById('inputNote');
const wizNext = document.getElementById('wizNext');
const wizCancel = document.getElementById('wizCancel');

let wizardStep = 1;

function openWizard() {
  wizardStep = 1;
  inputName.value = '';
  inputAmount.value = '';
  inputNote.value = '';
  updateWizard();
  modalWizard.classList.remove('hidden');
  setTimeout(() => inputName.focus(), 100);
}
function closeWizard() {
  modalWizard.classList.add('hidden');
}
function updateWizard() {
  step1.classList.toggle('hidden', wizardStep !== 1);
  step2.classList.toggle('hidden', wizardStep !== 2);
  step3.classList.toggle('hidden', wizardStep !== 3);

  dot1.className = 'w-3 h-3 rounded-full ' + (wizardStep >= 1 ? 'bg-blue-700' : 'bg-gray-300');
  dot2.className = 'w-3 h-3 rounded-full ' + (wizardStep >= 2 ? 'bg-blue-700' : 'bg-gray-300');
  dot3.className = 'w-3 h-3 rounded-full ' + (wizardStep >= 3 ? 'bg-blue-700' : 'bg-gray-300');

  wizNext.textContent = wizardStep === 3 ? 'Terminer' : 'Suivant';

  setTimeout(() => {
    if (wizardStep === 1) inputName.focus();
    if (wizardStep === 2) inputAmount.focus();
    if (wizardStep === 3) inputNote.focus();
  }, 80);
}

wizNext.addEventListener('click', () => {
  if (wizardStep === 1) {
    if (!inputName.value.trim()) { showToast('Entre un nom'); return; }
    wizardStep = 2;
    updateWizard();
  } else if (wizardStep === 2) {
    const v = parseFloat(inputAmount.value.replace(',', '.'));
    if (isNaN(v) || v <= 0) { showToast('Entre un montant valide'); return; }
    wizardStep = 3;
    updateWizard();
  } else {
    const credit = {
      id: uid(),
      name: inputName.value.trim(),
      amount: parseFloat(inputAmount.value.replace(',', '.')),
      note: inputNote.value.trim(),
      createdAt: new Date().toISOString(),
      paidAt: null
    };
    state.credits.unshift(credit);
    saveData();
    renderCredits();
    closeWizard();
    showToast('Crédit ajouté ✓');
  }
});
wizCancel.addEventListener('click', closeWizard);

[inputName, inputAmount, inputNote].forEach(inp => {
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); wizNext.click(); }
  });
});

/* =========================================================
   NAVIGATION
   ========================================================= */
const historyView = document.getElementById('historyView');
document.getElementById('btnHistory').addEventListener('click', () => {
  renderHistory();
  historyView.classList.remove('hidden');
});
document.getElementById('btnBack').addEventListener('click', () => {
  historyView.classList.add('hidden');
});

/* =========================================================
   EFFACER HISTORIQUE
   ========================================================= */
document.getElementById('btnClearHistory').addEventListener('click', () => {
  if (state.history.length === 0) { showToast('Historique déjà vide'); return; }
  openConfirm(
    'Effacer tout ?',
    "Tout l'historique sera supprimé définitivement.",
    () => {
      state.history = [];
      saveData();
      renderHistory();
      showToast('Historique effacé');
    }
  );
});

/* =========================================================
   BOUTON AJOUTER
   ========================================================= */
document.getElementById('btnAdd').addEventListener('click', openWizard);

/* =========================================================
   SERVICE WORKER
   ========================================================= */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'mesCredits-v6';
    const ASSETS = ['./', './index.html', 'https://cdn.tailwindcss.com'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>

        caches.match(e.request).then(cached => {

              caches.open(CACHE).then(c => c.put(e.request, clone));

          }).catch(() => cached);
          return cached || fetchPromise;
