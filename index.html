<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Application simple pour gérer les crédits à régler" />
<title>Mes Crédits</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mes%20Cr%C3%A9dits%22%2C%22short_name%22%3A%22Cr%C3%A9dits%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%253E%253Cdefs%253E%253ClinearGradient%2520id%253D%2527g%2527%2520x1%253D%25270%2527%2520y1%253D%25270%2527%2520x2%253D%25271%2527%2520y2%253D%25271%2527%253E%253Cstop%2520offset%253D%25270%2527%2520stop-color%253D%2527%25236366f1%2527%2F%253E%253Cstop%2520offset%253D%25271%2527%2520stop-color%253D%2527%2523a855f7%2527%2F%253E%253C%2FlinearGradient%253E%253C%2Fdefs%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527120%2527%2520fill%253D%2527url(%2523g)%2527%2F%253E%253Ctext%2520x%253D%2527256%2527%2520y%253D%2527330%2527%2520font-size%253D%2527260%2527%2520text-anchor%253D%2527middle%2527%2520fill%253D%2527white%2527%2520font-weight%253D%2527bold%2527%253E%25E2%2582%25AC%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%2520maskable%22%7D%5D%7D" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-1: #6366f1;
    --brand-2: #a855f7;
    --brand-3: #ec4899;
    --bg: #0b1120;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body {
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    overscroll-behavior-y: none;
    margin: 0;
    min-height: 100vh;
  }
  button { font-family: inherit; }

  .bg-canvas {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.35), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(168,85,247,.28), transparent 55%),
      radial-gradient(900px 500px at 50% 120%, rgba(236,72,153,.22), transparent 60%),
      var(--bg);
  }
  .bg-canvas::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 75%);
  }

  .glass {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 20px 40px -20px rgba(0,0,0,.6);
  }
  .glass-solid {
    background: rgba(15,23,42,.78);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 25px 60px -25px rgba(0,0,0,.9);
  }

  .brand-grad { background: linear-gradient(135deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3)); }
  .brand-text {
    background: linear-gradient(135deg, #a5b4fc, #e9d5ff, #fbcfe8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    font-weight: 800;
    transition: transform .12s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
    cursor: pointer;
    border: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .btn:focus-visible { outline: 2px solid #a855f7; outline-offset: 3px; }

  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    box-shadow:
      0 10px 30px -10px rgba(99,102,241,.7),
      0 0 0 1px rgba(255,255,255,.08) inset,
      0 1px 0 rgba(255,255,255,.25) inset;
    color: white;
  }
  .btn-primary::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.25), transparent 45%);
    pointer-events: none; opacity: .7;
  }
  .btn-primary:active { transform: scale(.97); filter: brightness(.95); }

  .btn-danger {
    background: linear-gradient(135deg, #f43f5e, #be123c);
    box-shadow: 0 8px 22px -8px rgba(244,63,94,.7), 0 1px 0 rgba(255,255,255,.2) inset;
    color: white;
  }
  .btn-danger:active { transform: scale(.94); filter: brightness(.95); }

  .btn-ghost {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: white;
  }
  .btn-ghost:active { transform: scale(.95); background: rgba(255,255,255,.14); }

  .total-banner {
    background: linear-gradient(135deg, #be123c, #e11d48 60%, #f43f5e);
    cursor: pointer;
    transition: transform .15s ease, filter .2s ease;
    box-shadow: 0 20px 50px -20px rgba(244,63,94,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .total-banner:active { transform: scale(.97); filter: brightness(.95); }
  .total-banner:hover { filter: brightness(1.05); }

  .fade-in { animation: fadeIn .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  .modal-in { animation: modalIn .28s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.9) translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes pulseSoft {
    0%,100% { box-shadow: 0 20px 50px -20px rgba(244,63,94,.55), 0 0 0 1px rgba(255,255,255,.08) inset; }
    50%     { box-shadow: 0 25px 60px -20px rgba(244,63,94,.85), 0 0 0 1px rgba(255,255,255,.12) inset; }
  }
  .pulse-soft { animation: pulseSoft 3s ease-in-out infinite; }

  .paid-flash { animation: paidFlash .7s ease; }
  @keyframes paidFlash {
    0%   { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
    50%  { box-shadow: 0 0 0 14px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .input-lux {
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(255,255,255,.14);
    color: white;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    width: 100%;
    font-family: inherit;
  }
  .input-lux::placeholder { color: rgba(255,255,255,.35); }
  .input-lux:focus {
    outline: none;
    border-color: #a855f7;
    background: rgba(255,255,255,.09);
    box-shadow: 0 0 0 4px rgba(168,85,247,.18);
  }
  .input-lux::-webkit-outer-spin-button,
  .input-lux::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .input-lux[type=number] { -moz-appearance: textfield; appearance: textfield; }

  #modalWizard { transition: padding-bottom .25s ease; }
  #wizardCard {
    transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
    will-change: transform;
  }
  @media (max-width: 640px) {
    #modalWizard { align-items: flex-start; padding-top: 8vh; }
    #modalWizard.kb-open { padding-top: 2vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .pulse-soft { animation: none; }
  }
</style>
</head>
<body class="text-white">

<div class="bg-canvas" aria-hidden="true"></div>

<!-- ÉCRAN ACCUEIL -->
<main id="app" class="max-w-xl mx-auto p-4 pb-44 relative">

  <header class="flex items-center justify-between mb-5 pt-3">
    <div class="flex items-center gap-3">
      <div class="brand-grad w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-900/40" aria-hidden="true">
        <span class="text-2xl font-black text-white drop-shadow">€</span>
      </div>
      <div>
        <h1 class="text-2xl font-black leading-none brand-text">Mes crédits</h1>
        <p class="text-xs text-white/50 mt-0.5 tracking-wide">Gérez ce qu'il reste à payer</p>

    <button id="btnHistory" type="button" data-haptic="medium"

      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4"/>

      Historique

  <button id="btnAdd" type="button" data-haptic="heavy"
    class="btn btn-primary w-full mb-4 py-5 rounded-3xl text-lg"

</main>

<!-- BANDEAU TOTAL -->
<button id="totalBanner" type="button"

</button>

<!-- HISTORIQUE -->
<section id="historyView" class="hidden fixed inset-0 z-30 overflow-y-auto" style="background:var(--bg);">
  <div class="bg-canvas" aria-hidden="true"></div>
  <div class="max-w-xl mx-auto p-4 pb-10 relative">

    <header class="flex items-center justify-between mb-5 pt-3">

<!-- MODALE CONFIRMATION -->
<div id="modalConfirm" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"

<!-- MODALE AJOUT -->
<div id="modalWizard" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"

  <div id="wizardCard" class="glass-solid rounded-3xl p-6 w-full max-w-sm modal-in">

        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>

        <span class="absolute right-5 top-1/2 -translate-y-1/2 text-2xl font-black text-white/40 pointer-events-none" aria-hidden="true">€</span>

      <div class="flex gap-3">
        <button id="wizCancel" type="button" data-haptic="light"
          class="btn btn-ghost flex-1 py-4 rounded-2xl text-lg">

        <button id="wizNext" type="submit" data-haptic="heavy"

<!-- TOAST -->
<div id="toast" role="status" aria-live="polite"
  class="hidden fixed bottom-32 left-1/2 -translate-x-1/2 glass-solid text-white text-base font-bold px-6 py-3 rounded-2xl shadow-2xl z-50"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  storageKey: 'mesCredits_v1',
  historyLimit: 500,
  minAmount: 0.01,
  maxAmount: 999999.99,
  toastDuration: 1800,
  keyboardThreshold: 80
};

/* ============================================================
   HAPTIC
   ============================================================ */
const HAPTIC_PATTERNS = {
  light:   8,
  medium:  18,
  heavy:   [12, 30, 12],
  success: [10, 40, 20],
  error:   [30, 50, 30, 50, 30]
};
const supportsVibrate = 'vibrate' in navigator;

function haptic(type = 'light') {
  if (!supportsVibrate) return;
  try { navigator.vibrate(HAPTIC_PATTERNS[type] || HAPTIC_PATTERNS.light); } catch(_) {}
}

function bindHaptics(root = document) {
  root.querySelectorAll('[data-haptic]').forEach(el => {
    if (el.dataset.hapticBound) return;
    el.dataset.hapticBound = '1';
    el.addEventListener('pointerdown', () => haptic(el.dataset.haptic), { passive: true });
  });
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function formatPrice(n) {
  const v = Number(n) || 0;
  return v.toFixed(2).replace('.', ',') + ' €';
}
function formatDateShort(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function formatTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function formatDateLong(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Aujourd'hui";
  if (sameDay(d, yest)) return 'Hier';
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function dateKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseAmount(str) {
  if (typeof str !== 'string') return NaN;
  const cleaned = str.trim().replace(/\s/g, '').replace(',', '.');
  if (!cleaned) return NaN;
  const v = parseFloat(cleaned);
  if (!isFinite(v)) return NaN;
  return Math.round(v * 100) / 100;
}

/* ============================================================
   STOCKAGE
   ============================================================ */
function isValidCredit(c) {
  return c && typeof c === 'object' && typeof c.id === 'string' && isFinite(c.amount) && c.amount > 0;
}

function loadData() {
  try {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (!raw) return { credits: [], history: [] };
    const d = JSON.parse(raw);
    return {
      credits: Array.isArray(d.credits) ? d.credits.filter(isValidCredit) : [],
      history: Array.isArray(d.history) ? d.history.filter(isValidCredit).slice(0, CONFIG.historyLimit) : []
    };
  } catch (e) {
    console.warn('Erreur de chargement:', e);
    return { credits: [], history: [] };
  }
}

function saveData() {
  try {
    if (state.history.length > CONFIG.historyLimit) {
      state.history = state.history.slice(0, CONFIG.historyLimit);
    }
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
  } catch (e) {
    console.warn('Erreur de sauvegarde:', e);
    showToast('⚠️ Sauvegarde impossible');
  }
}

let state = loadData();

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), CONFIG.toastDuration);
}

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);

const listCredits       = $('listCredits');
const emptyMsg          = $('emptyMsg');
const totalBanner       = $('totalBanner');
const totalValue        = $('totalValue');
const totalCount        = $('totalCount');
const historyView       = $('historyView');
const historyGroups     = $('historyGroups');
const emptyHistory      = $('emptyHistory');
const historyTotal      = $('historyTotal');
const historyTotalValue = $('historyTotalValue');
const historyCount      = $('historyCount');
const modalConfirm      = $('modalConfirm');
const modalTitle        = $('modalTitle');
const modalText         = $('modalText');
const modalOk           = $('modalOk');
const modalCancel       = $('modalCancel');
const modalWizard       = $('modalWizard');
const wizardCard        = $('wizardCard');
const wizardForm        = $('wizardForm');
const inputAmount       = $('inputAmount');
const wizNext           = $('wizNext');
const wizCancel         = $('wizCancel');

/* ============================================================
   RENDU ACCUEIL
   ============================================================ */
function renderCredits() {
  const frag = document.createDocumentFragment();

  state.credits.forEach(c => {
    const li = document.createElement('li');
    li.className = 'glass rounded-3xl px-5 py-4 flex items-center gap-3 fade-in';

    const pill = document.createElement('div');
    pill.className = 'shrink-0 w-10 h-10 rounded-2xl flex items-center justify-center';
    pill.style.cssText = 'background:linear-gradient(135deg,rgba(244,63,94,.22),rgba(190,18,60,.12));border:1px solid rgba(244,63,94,.35)';
    pill.innerHTML = '<span class="text-rose-300 font-black text-lg">€</span>';

    const info = document.createElement('div');
    info.className = 'min-w-0 flex-1';
    info.innerHTML = `<div class="text-[11px] text-white/45 num">Ajouté le ${formatDateShort(c.createdAt)} à ${formatTime(c.createdAt)}</div>`;

    const amount = document.createElement('div');
    amount.className = 'num shrink-0 text-2xl font-black text-white text-right';
    amount.textContent = formatPrice(c.amount);

    li.append(pill, info, amount);
    frag.appendChild(li);
  });

  listCredits.replaceChildren(frag);
  emptyMsg.classList.toggle('hidden', state.credits.length > 0);
  renderTotalBanner();
}

/* ============================================================
   BANDEAU TOTAL
   ============================================================ */
function renderTotalBanner() {
  const has = state.credits.length > 0;
  totalBanner.classList.toggle('hidden', !has);
  if (!has) return;

  const total = state.credits.reduce((s, c) => s + c.amount, 0);
  const n = state.credits.length;

  totalValue.textContent = formatPrice(total);
  totalCount.textContent = n + (n > 1 ? ' crédits en attente' : ' crédit en attente');
}

/* ============================================================
   RÉGLER TOUT
   ============================================================ */
function payAll() {
  if (state.credits.length === 0) return;

  const total = state.credits.reduce((s, c) => s + c.amount, 0);
  const now = new Date().toISOString();

  state.credits.forEach(c => {
    c.paidAt = now;
    state.history.unshift(c);
  });
  state.credits = [];

  saveData();
  renderCredits();
  renderHistory();

  totalBanner.classList.add('paid-flash');
  setTimeout(() => totalBanner.classList.remove('paid-flash'), 700);

  haptic('success');
  showToast('Tout est réglé ✓ ' + formatPrice(total));
}

/* ============================================================
   RENDU HISTORIQUE
   ============================================================ */
function renderHistory() {
  const frag = document.createDocumentFragment();

  if (state.history.length === 0) {
    historyGroups.replaceChildren();
    emptyHistory.classList.remove('hidden');
    historyTotal.classList.add('hidden');
    return;
  }
  emptyHistory.classList.add('hidden');
  historyTotal.classList.remove('hidden');

  const total = state.history.reduce((s, h) => s + h.amount, 0);
  historyTotalValue.textContent = formatPrice(total);
  historyCount.textContent = state.history.length + (state.history.length > 1 ? ' règlements' : ' règlement');

  const groups = new Map();
  state.history
    .slice()
    .sort((a, b) => new Date(b.paidAt) - new Date(a.paidAt))
    .forEach(h => {
      const k = dateKey(h.paidAt);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(h);
    });

  const sortedKeys = [...groups.keys()].sort((a, b) => b.localeCompare(a));

  sortedKeys.forEach(key => {
    const items = groups.get(key);
    const dayTotal = items.reduce((s, h) => s + h.amount, 0);

    const section = document.createElement('section');

    const header = document.createElement('div');
    header.className = 'flex items-baseline justify-between px-2 mb-2';
    header.innerHTML = `
      <span class="text-xs font-black text-white/80 uppercase tracking-widest">${formatDateLong(items[0].paidAt)}</span>
      <span class="num text-xs font-bold text-white/50">${items.length} · ${formatPrice(dayTotal)}</span>
    `;
    section.appendChild(header);

    const card = document.createElement('div');
    card.className = 'glass rounded-3xl overflow-hidden divide-y divide-white/5';

    items.forEach(h => {
      const row = document.createElement('div');
      row.className = 'px-5 py-3.5 fade-in';
      row.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="shrink-0 w-8 h-8 rounded-2xl flex items-center justify-center"
               style="background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(5,150,105,.15));border:1px solid rgba(16,185,129,.35)">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] text-white/45 num">
              Ajout ${formatDateShort(h.createdAt)} ${formatTime(h.createdAt)}
              <span class="text-white/20 mx-1">→</span>
              Réglé ${formatTime(h.paidAt)}
            </div>
          </div>
          <div class="num shrink-0 text-lg font-black text-white text-right">${formatPrice(h.amount)}</div>
        </div>
      `;
      card.appendChild(row);
    });

    section.appendChild(card);
    frag.appendChild(section);
  });

  historyGroups.replaceChildren(frag);
}

/* ============================================================
   MODALE CONFIRMATION
   ============================================================ */
let confirmCallback = null;
let lastFocusedEl = null;

function openConfirm(title, text, onOk) {
  modalTitle.textContent = title;
  modalText.textContent = text;
  confirmCallback = onOk;
  lastFocusedEl = document.activeElement;
  modalConfirm.classList.remove('hidden');
  haptic('medium');
  setTimeout(() => modalOk.focus(), 100);
}

function closeConfirm() {
  modalConfirm.classList.add('hidden');
  confirmCallback = null;
  if (lastFocusedEl && document.contains(lastFocusedEl) && lastFocusedEl.focus) {
    try { lastFocusedEl.focus({ preventScroll: true }); } catch(_) {}
  }
  lastFocusedEl = null;
}

modalCancel.addEventListener('click', () => { haptic('light'); closeConfirm(); });
modalOk.addEventListener('click', () => {
  haptic('heavy');
  const cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
});

/* ============================================================
   MODALE AJOUT — VERSION CORRIGÉE
   ============================================================ */
let wizardBusy = false;
let wizardOpenRaf = null;

function openWizard() {
  if (wizardBusy) return;
  inputAmount.value = '';
  modalWizard.classList.remove('hidden');
  haptic('medium');
  if (wizardOpenRaf) cancelAnimationFrame(wizardOpenRaf);
  wizardOpenRaf = requestAnimationFrame(() => {
    wizardOpenRaf = null;
    try { inputAmount.focus({ preventScroll: true }); } catch(_) {}
  });
}

function closeWizard() {
  try { inputAmount.blur(); } catch(_) {}
  modalWizard.classList.add('hidden');
  wizardBusy = false;
}

function submitAmount() {
  if (wizardBusy) return;

  const v = parseAmount(inputAmount.value);

  if (isNaN(v) || v < CONFIG.minAmount) {
    haptic('error');
    showToast('Entre un montant valide');
    try { inputAmount.focus({ preventScroll: true }); } catch(_) {}
    return;
  }
  if (v > CONFIG.maxAmount) {
    haptic('error');
    showToast('Montant trop élevé');
    try { inputAmount.focus({ preventScroll: true }); } catch(_) {}
    return;
  }

  wizardBusy = true;

  const credit = {
    id: uid(),
    amount: v,
    createdAt: new Date().toISOString(),
    paidAt: null
  };
  state.credits.unshift(credit);
  saveData();

  closeWizard();

  renderCredits();
  haptic('success');
  showToast('Crédit ajouté ✓ ' + formatPrice(v));
}

wizardForm.addEventListener('submit', e => {
  e.preventDefault();
  submitAmount();
});

wizCancel.addEventListener('click', e => {
  e.preventDefault();
  haptic('light');
  closeWizard();
});

/* ============================================================
   NAVIGATION
   ============================================================ */
$('btnHistory').addEventListener('click', () => {
  renderHistory();
  historyView.classList.remove('hidden');
});
$('btnBack').addEventListener('click', () => {
  historyView.classList.add('hidden');
});

/* ============================================================
   EFFACER HISTORIQUE
   ============================================================ */
$('btnClearHistory').addEventListener('click', () => {
  if (state.history.length === 0) {
    haptic('error');
    showToast('Historique déjà vide');
    return;
  }
  openConfirm(
    'Effacer tout ?',
    "Tout l'historique sera supprimé définitivement.",
    () => {
      state.history = [];
      saveData();
      renderHistory();
      haptic('success');
      showToast('Historique effacé');
    }
  );
});

/* ============================================================
   BOUTON AJOUTER
   ============================================================ */
$('btnAdd').addEventListener('click', openWizard);

/* ============================================================
   BANDEAU TOTAL
   ============================================================ */
totalBanner.addEventListener('click', () => {
  if (state.credits.length === 0) return;
  const total = state.credits.reduce((s, c) => s + c.amount, 0);
  const n = state.credits.length;
  openConfirm(
    'Tout régler ?',
    `${n} crédit${n > 1 ? 's' : ''} pour un total de ${formatPrice(total)}.`,
    payAll
  );
});

/* ============================================================
   CLAVIER MOBILE
   ============================================================ */
(function setupKeyboardHandling() {
  const vv = window.visualViewport;
  if (!vv) return;

  let rafId = null;

  function update() {
    if (modalWizard.classList.contains('hidden')) return;

    const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);

    if (keyboardHeight > CONFIG.keyboardThreshold) {
      modalWizard.classList.add('kb-open');
      const shift = Math.min(keyboardHeight / 2, 220);
      wizardCard.style.transform = `translateY(-${shift}px)`;
    } else {
      modalWizard.classList.remove('kb-open');
      wizardCard.style.transform = '';
    }
  }

  function scheduleUpdate() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      update();
    });
  }

  vv.addEventListener('resize', scheduleUpdate);
  vv.addEventListener('scroll', scheduleUpdate);
  window.addEventListener('orientationchange', () => setTimeout(update, 250));

  const observer = new MutationObserver(() => {
    if (modalWizard.classList.contains('hidden')) {
      modalWizard.classList.remove('kb-open');
      wizardCard.style.transform = '';
    } else {
      setTimeout(update, 300);
    }
  });
  observer.observe(modalWizard, { attributes: true, attributeFilter: ['class'] });
})();

/* ============================================================
   RACCOURCIS CLAVIER
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!modalConfirm.classList.contains('hidden')) closeConfirm();
    else if (!modalWizard.classList.contains('hidden')) closeWizard();
    else if (!historyView.classList.contains('hidden')) historyView.classList.add('hidden');
  }
});

/* ============================================================
   SÉCURITÉ : blur au passage en arrière-plan
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !modalWizard.classList.contains('hidden')) {
    try { inputAmount.blur(); } catch(_) {}
  }
});

/* ============================================================
   SERVICE WORKER
   ============================================================ */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'mesCredits-v11';
    const ASSETS = ['./', './index.html', 'https://cdn.tailwindcss.com', 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(cached => {
          const fetchPromise = fetch(e.request).then(res => {
            if (res && res.status === 200 && (res.type === 'basic' || res.type === 'cors')) {
              const clone = res.clone();
              caches.open(CACHE).then(c => c.put(e.request, clone));
            }
            return res;
          }).catch(() => cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(() => {});
  } catch(_) {}
}

/* ============================================================
   INIT
   ============================================================ */
bindHaptics();
renderCredits();
renderHistory();
</script>
