<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Crédits</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
:root{
  --bg:#0b1120;
  --panel:#111a2d;
  --panel2:#162039;
  --border:rgba(255,255,255,.10);
  --indigo:#6366f1;
  --purple:#a855f7;
  --pink:#ec4899;
  --red:#f43f5e;
  --red2:#be123c;
  --green:#10b981;
  --text:#fff;
  --muted:rgba(255,255,255,.55);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

/* ============================================================
   BACKGROUND
   ============================================================ */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(700px 400px at 0% 0%,rgba(99,102,241,.28),transparent 70%),
    radial-gradient(700px 400px at 100% 0%,rgba(168,85,247,.22),transparent 70%),
    radial-gradient(700px 400px at 50% 100%,rgba(236,72,153,.16),transparent 70%),
    var(--bg);
}

/* ============================================================
   APP
   ============================================================ */
#app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px 160px 16px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logo{
  width:48px;
  height:48px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:linear-gradient(135deg,var(--indigo),var(--purple) 55%,var(--pink));
  box-shadow:0 12px 30px rgba(99,102,241,.25);
}

.logo span{
  font-size:25px;
  font-weight:900;
}

.brand-title{
  margin:0;
  font-size:24px;
  line-height:1;
  font-weight:900;
  background:linear-gradient(135deg,#a5b4fc,#e9d5ff,#fbcfe8);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand-subtitle{
  margin-top:5px;
  color:rgba(255,255,255,.48);
  font-size:11px;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:16px;
  color:#fff;
  font-size:14px;
  font-weight:800;
  transition:transform .12s ease,filter .12s ease;
}

.btn:active{
  transform:scale(.96);
}

.btn-history{
  padding:0 15px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);
}

.btn-add{
  width:100%;
  margin-bottom:16px;
  padding:17px;
  border-radius:22px;
  font-size:17px;
  background:linear-gradient(135deg,var(--indigo),var(--purple));
  box-shadow:0 14px 35px rgba(99,102,241,.28);
}

.btn-primary{
  flex:1;
  background:linear-gradient(135deg,var(--indigo),var(--purple));
}

.btn-secondary{
  flex:1;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);
}

.btn-danger{
  background:linear-gradient(135deg,#f43f5e,#be123c);
}

/* ============================================================
   CREDITS
   ============================================================ */
#listCredits{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.credit{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  border:1px solid var(--border);
  box-shadow:0 14px 35px rgba(0,0,0,.18);
  animation:appear .2s ease-out;
}

.credit-icon{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  color:#fda4af;
  background:rgba(244,63,94,.15);
  border:1px solid rgba(244,63,94,.30);
  font-size:18px;
  font-weight:900;
}

.credit-info{
  flex:1;
  min-width:0;
}

.credit-date{
  color:rgba(255,255,255,.45);
  font-size:11px;
}

.credit-amount{
  flex:none;
  font-size:22px;
  font-weight:900;
}

/* ============================================================
   EMPTY
   ============================================================ */
#emptyMsg{
  text-align:center;
  margin-top:70px;
  color:rgba(255,255,255,.48);
  font-size:17px;
  line-height:1.7;
}

#emptyMsg strong{
  color:#c4b5fd;
}

/* ============================================================
   TOTAL
   ============================================================ */
#totalBanner{
  position:fixed;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:20;
  width:min(620px,100%);
  padding:0 14px;
  transform:translateX(-50%);
  background:none;
}

.total-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:17px 18px;
  border-radius:23px;
  background:linear-gradient(135deg,#be123c,#e11d48 60%,#f43f5e);
  box-shadow:0 18px 45px rgba(244,63,94,.32);
}

.total-label{
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:rgba(255,255,255,.8);
}

.total-count{
  margin-top:4px;
  font-size:11px;
  color:rgba(255,255,255,.68);
}

.total-hint{
  margin-top:4px;
  font-size:9px;
  color:rgba(255,255,255,.55);
}

.total-value{
  font-size:29px;
  font-weight:900;
  white-space:nowrap;
}

/* ============================================================
   FULLSCREEN VIEWS
   ============================================================ */
.fullscreen{
  position:fixed;
  inset:0;
  z-index:30;
  overflow-y:auto;
  background:var(--bg);
}

.view-inner{
  width:100%;
  max-width:620px;
  min-height:100%;
  margin:auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
}

/* ============================================================
   HISTORY
   ============================================================ */
.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:22px;
}

.history-title{
  font-size:21px;
  font-weight:900;
  background:linear-gradient(135deg,#a5b4fc,#e9d5ff,#fbcfe8);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.history-total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px;
  margin-bottom:20px;
  border-radius:22px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
}

.history-total-label{
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
}

.history-total-count{
  margin-top:4px;
  font-size:11px;
  color:rgba(255,255,255,.4);
}

.history-total-value{
  font-size:24px;
  font-weight:900;
  color:#c4b5fd;
}

.history-group{
  margin-bottom:22px;
}

.history-day{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px;
  margin-bottom:8px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  color:rgba(255,255,255,.65);
}

.history-card{
  overflow:hidden;
  border-radius:22px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
}

.history-row{
  padding:14px 16px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.history-row:last-child{
  border-bottom:0;
}

.history-line{
  display:flex;
  align-items:center;
  gap:10px;
}

.history-icon{
  width:32px;
  height:32px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  color:#34d399;
  background:rgba(16,185,129,.12);
  border:1px solid rgba(16,185,129,.25);
}

.history-info{
  flex:1;
  min-width:0;
  color:rgba(255,255,255,.45);
  font-size:10px;
}

.history-amount{
  flex:none;
  font-size:17px;
  font-weight:900;
}

.empty-history{
  text-align:center;
  margin-top:70px;
  color:rgba(255,255,255,.45);
  font-size:17px;
}

/* ============================================================
   MODALES
   ============================================================ */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.78);
}

.modal.open{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:22px;
  border-radius:25px;
  background:#111a2d;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px rgba(0,0,0,.65);
}

/* ============================================================
   ADD MODAL
   ============================================================ */
.add-icon{
  width:56px;
  height:56px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  background:linear-gradient(135deg,var(--indigo),var(--purple));
  font-size:28px;
  font-weight:300;
}

.modal-title{
  margin:0;
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.modal-subtitle{
  margin:5px 0 18px;
  text-align:center;
  color:rgba(255,255,255,.45);
  font-size:13px;
}

.amount-wrap{
  position:relative;
  margin-bottom:16px;
}

.amount-input{
  display:block;
  width:100%;
  height:72px;
  padding:0 50px 0 15px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.12);
  outline:none;
  background:#0b1120;
  color:#fff;
  font-size:32px;
  font-weight:900;
  text-align:center;
  transition:border-color .15s ease;
}

.amount-input:focus{
  border-color:#a855f7;
}

.amount-euro{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  color:rgba(255,255,255,.35);
  font-size:23px;
  font-weight:900;
  pointer-events:none;
}

.modal-buttons{
  display:flex;
  gap:10px;
}

/* ============================================================
   CONFIRM
   ============================================================ */
.confirm-text{
  margin:8px 0 22px;
  text-align:center;
  color:rgba(255,255,255,.65);
  line-height:1.5;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;
  left:50%;
  bottom:110px;
  z-index:200;
  transform:translateX(-50%);
  display:none;
  max-width:calc(100% - 30px);
  padding:13px 20px;
  border-radius:16px;
  background:#111a2d;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  color:#fff;
  font-size:14px;
  font-weight:800;
  text-align:center;
}

#toast.show{
  display:block;
}

/* ============================================================
   UTILS
   ============================================================ */
.hidden{
  display:none!important;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@media(max-width:500px){
  .brand-title{
    font-size:21px;
  }
  .brand-subtitle{
    font-size:10px;
  }
  .btn-history{
    padding:0 11px;
    font-size:12px;
  }
  .total-value{
    font-size:24px;
  }
  .modal{
    align-items:flex-start;
    padding-top:calc(45px + env(safe-area-inset-top));
  }
  .modal-card{
    max-width:none;
  }
}
</style>
</head>
<body>

<div class="background"></div>

<!-- ============================================================
     ACCUEIL
     ============================================================ -->
<main id="app">

  <header class="header">
    <div class="brand">
      <div class="logo">
        <span>€</span>
      </div>
      <div>
        <h1 class="brand-title">
          Mes crédits
        </h1>
        <div class="brand-subtitle">
          Gérez ce qu'il reste à payer
        </div>
      </div>
    </div>

    <button id="btnHistory" class="btn btn-history" type="button">
      ↻ Historique
    </button>
  </header>

  <!-- AJOUT -->
  <button id="btnAdd" class="btn btn-add" type="button">
    <span style="font-size:25px;line-height:1">＋</span>
    Ajouter un crédit
  </button>

  <!-- LISTE -->
  <ul id="listCredits"></ul>

  <!-- VIDE -->
  <div id="emptyMsg">
    Aucun crédit pour le moment.<br>
    <strong>
      Appuyez sur + Ajouter
    </strong>
  </div>

</main>

<!-- ============================================================
     TOTAL
     ============================================================ -->
<button id="totalBanner" type="button" class="hidden">
  <div class="total-inner">
    <div>
      <div class="total-label">
        Reste à payer
      </div>
      <div id="totalCount" class="total-count">
      </div>
      <div class="total-hint">
        Appuyez pour tout régler
      </div>
    </div>
    <div id="totalValue" class="total-value">
      0,00 €
    </div>
  </div>
</button>

<!-- ============================================================
     HISTORIQUE
     ============================================================ -->
<section id="historyView" class="fullscreen hidden">
  <div class="view-inner">

    <header class="history-header">
      <button id="btnBack" type="button" class="btn btn-history">
        ← Retour
      </button>

      <div class="history-title">
        Historique
      </div>

      <button id="btnClearHistory" type="button" class="btn btn-danger" style="padding:0 14px">
        Effacer
      </button>
    </header>

    <div id="historyTotal" class="history-total hidden">
      <div>
        <div class="history-total-label">
          Total réglé
        </div>
        <div id="historyCount" class="history-total-count">
        </div>
      </div>
      <div id="historyTotalValue" class="history-total-value">
        0,00 €
      </div>
    </div>

    <div id="historyGroups"></div>

    <div id="emptyHistory" class="empty-history hidden">
      Aucun règlement enregistré.
    </div>

  </div>
</section>

<!-- ============================================================
     MODALE AJOUT
     ============================================================ -->
<div id="modalWizard" class="modal" aria-hidden="true">
  <div class="modal-card">

    <div class="add-icon">
      ＋
    </div>

    <h2 class="modal-title">
      Montant
    </h2>

    <div class="modal-subtitle">
      Combien reste-t-il à payer ?
    </div>

    <div class="amount-wrap">
      <input id="inputAmount" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Montant">
      <span class="amount-euro">
        €
      </span>
    </div>

    <div class="modal-buttons">
      <button id="wizCancel" class="btn btn-secondary" type="button">
        Annuler
      </button>

      <button id="wizNext" class="btn btn-primary" type="button">
        Ajouter
      </button>
    </div>

  </div>
</div>

<!-- ============================================================
     MODALE CONFIRMATION
     ============================================================ -->
<div id="modalConfirm" class="modal" aria-hidden="true">
  <div class="modal-card">

    <h2 id="modalTitle" class="modal-title">
      Confirmer ?
    </h2>

    <div id="modalText" class="confirm-text">
    </div>

    <div class="modal-buttons">
      <button id="modalCancel" class="btn btn-secondary" type="button">
        Annuler
      </button>

      <button id="modalOk" class="btn btn-primary" type="button">
        Confirmer
      </button>
    </div>

  </div>
</div>

<!-- ============================================================
     TOAST
     ============================================================ -->
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  storageKey:"mesCredits_final",
  historyLimit:500,
  minAmount:0.01,
  maxAmount:999999.99
};

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);

const btnAdd = $("btnAdd");
const btnHistory = $("btnHistory");
const btnBack = $("btnBack");

const listCredits = $("listCredits");
const emptyMsg = $("emptyMsg");

const totalBanner = $("totalBanner");
const totalValue = $("totalValue");
const totalCount = $("totalCount");

const historyView = $("historyView");
const historyGroups = $("historyGroups");
const emptyHistory = $("emptyHistory");
const historyTotal = $("historyTotal");
const historyTotalValue = $("historyTotalValue");
const historyCount = $("historyCount");
const btnClearHistory = $("btnClearHistory");

const modalWizard = $("modalWizard");
const inputAmount = $("inputAmount");
const wizNext = $("wizNext");
const wizCancel = $("wizCancel");

const modalConfirm = $("modalConfirm");
const modalTitle = $("modalTitle");
const modalText = $("modalText");
const modalOk = $("modalOk");
const modalCancel = $("modalCancel");

const toast = $("toast");

/* ============================================================
   ÉTAT
   ============================================================ */
let state = {
  credits:[],
  history:[]
};

let confirmAction = null;

/* ============================================================
   HAPTIC
   ============================================================ */
function haptic(pattern){
  if(!navigator.vibrate){
    return;
  }
  try{
    navigator.vibrate(pattern || 10);
  }catch(_){}
}

/* ============================================================
   STORAGE
   ============================================================ */
function validCredit(item){
  return (
    item &&
    typeof item.id === "string" &&
    Number.isFinite(Number(item.amount)) &&
    Number(item.amount) > 0
  );
}

function load(){
  try{
    const raw = localStorage.getItem(CONFIG.storageKey);

    if(!raw){
      return;
    }

    const data = JSON.parse(raw);

    if(!data || typeof data !== "object"){
      return;
    }

    if(Array.isArray(data.credits)){
      state.credits = data.credits
        .filter(validCredit)
        .map(item => ({
          ...item,
          amount:Number(item.amount)
        }));
    }

    if(Array.isArray(data.history)){
      state.history = data.history
        .filter(validCredit)
        .slice(0,CONFIG.historyLimit)
        .map(item => ({
          ...item,
          amount:Number(item.amount)
        }));
    }

  }catch(error){
    console.error(
      "Erreur de lecture:",
      error
    );

    state = {
      credits:[],
      history:[]
    };
  }
}

function save(){
  try{
    localStorage.setItem(
      CONFIG.storageKey,
      JSON.stringify({
        credits:state.credits,
        history:state.history
      })
    );

    return true;

  }catch(error){
    console.error(
      "Erreur localStorage:",
      error
    );

    showToast(
      "Impossible de sauvegarder"
    );

    return false;
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function uid(){
  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,9)
  );
}

function price(value){
  return Number(value || 0)
    .toLocaleString(
      "fr-FR",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    ) + " €";
}

function amountFromInput(value){
  if(typeof value !== "string"){
    return NaN;
  }

  let text = value
    .trim()
    .replace(/\s/g,"")
    .replace(/€/g,"");

  if(!text){
    return NaN;
  }

  /*
   * 1.250,50 → 1250.50
   */
  if(text.includes(",")){
    text = text
      .replace(/\./g,"")
      .replace(",",".");
  }

  const number = Number(text);

  if(!Number.isFinite(number)){
    return NaN;
  }

  return Math.round(number * 100) / 100;
}

function shortDate(iso){
  const date = new Date(iso);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleDateString(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"2-digit"
    }
  );
}

function time(iso){
  const date = new Date(iso);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleTimeString(
    "fr-FR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function dateKey(iso){
  const d = new Date(iso);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );
}

function longDate(iso){
  const d = new Date(iso);
  const today = new Date();
  const yesterday = new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );

  const sameDay = (a,b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  if(sameDay(d,today)){
    return "Aujourd'hui";
  }

  if(sameDay(d,yesterday)){
    return "Hier";
  }

  return d.toLocaleDateString(
    "fr-FR",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    () => toast.classList.remove("show"),
    1800
  );
}

/* ============================================================
   RENDU CRÉDITS
   ============================================================ */
function renderCredits(){
  listCredits.innerHTML = "";

  for(const credit of state.credits){
    const li = document.createElement("li");
    li.className = "credit";

    const icon = document.createElement("div");
    icon.className = "credit-icon";
    icon.textContent = "€";

    const info = document.createElement("div");
    info.className = "credit-info";

    const date = document.createElement("div");
    date.className = "credit-date";
    date.textContent =
      "Ajouté le " +
      shortDate(credit.createdAt) +
      " à " +
      time(credit.createdAt);

    info.appendChild(date);

    const amount = document.createElement("div");
    amount.className = "credit-amount";
    amount.textContent = price(credit.amount);

    li.append(
      icon,
      info,
      amount
    );

    listCredits.appendChild(li);
  }

  emptyMsg.classList.toggle(
    "hidden",
    state.credits.length !== 0
  );

  renderTotal();
}

/* ============================================================
   TOTAL
   ============================================================ */
function totalCredits(){
  return state.credits.reduce(
    (sum,item) => sum + Number(item.amount),
    0
  );
}

function renderTotal(){
  if(state.credits.length === 0){
    totalBanner.classList.add("hidden");
    return;
  }

  totalBanner.classList.remove("hidden");

  totalValue.textContent = price(totalCredits());

  totalCount.textContent =
    state.credits.length +
    (
      state.credits.length > 1
        ? " crédits en attente"
        : " crédit en attente"
    );
}

/* ============================================================
   MODALE AJOUT
   ============================================================ */
function openAddModal(){
  /*
   * Réinitialise le champ.
   */
  inputAmount.value = "";

  /*
   * Ouvre la modale.
   */
  modalWizard.classList.add("open");
  modalWizard.setAttribute(
    "aria-hidden",
    "false"
  );

  haptic(18);

  /*
   * ============================================================
   * FOCUS AUTOMATIQUE SUR LE CHAMP MONTANT
   * ============================================================
   *
   * Le double requestAnimationFrame garantit que :
   * 1) La modale est bien passée en display:flex
   * 2) Le navigateur a peint l'élément
   * 3) Le focus est accepté et le clavier s'ouvre (mobile)
   *
   * Un fallback setTimeout est prévu pour les navigateurs
   * qui ignorent le rAF dans certains contextes.
   */
  let focused = false;

  const doFocus = () => {
    if(focused){
      return;
    }
    focused = true;

    try{
      inputAmount.focus({ preventScroll: true });
    }catch(_){
      try{
        inputAmount.focus();
      }catch(__){}
    }
  };

  requestAnimationFrame(() => {
    requestAnimationFrame(doFocus);
  });

  setTimeout(doFocus, 120);
}

function closeAddModal(){
  /*
   * On retire le focus avant de cacher,
   * pour fermer proprement le clavier mobile.
   */
  if(document.activeElement === inputAmount){
    try{
      inputAmount.blur();
    }catch(_){}
  }

  modalWizard.classList.remove("open");
  modalWizard.setAttribute(
    "aria-hidden",
    "true"
  );

  inputAmount.value = "";
}

/* ============================================================
   AJOUT CRÉDIT
   ============================================================ */
function addCredit(){
  const amount = amountFromInput(
    inputAmount.value
  );

  if(!Number.isFinite(amount)){
    haptic([30,50,30]);
    showToast(
      "Entre un montant valide"
    );
    focusAmountAgain();
    return;
  }

  if(amount < CONFIG.minAmount){
    haptic([30,50,30]);
    showToast(
      "Le montant doit être supérieur à 0"
    );
    focusAmountAgain();
    return;
  }

  if(amount > CONFIG.maxAmount){
    haptic([30,50,30]);
    showToast(
      "Montant trop élevé"
    );
    focusAmountAgain();
    return;
  }

  /*
   * CRÉATION DU CRÉDIT.
   */
  const credit = {
    id:uid(),
    amount:amount,
    createdAt: new Date().toISOString(),
    paidAt:null
  };

  /*
   * AJOUT.
   */
  state.credits.unshift(credit);

  /*
   * FERMETURE IMMÉDIATE.
   */
  closeAddModal();

  /*
   * SAUVEGARDE.
   */
  save();

  /*
   * RENDU.
   */
  renderCredits();

  haptic([10,40,20]);
  showToast(
    "Crédit ajouté ✓ " +
    price(amount)
  );
}

/*
 * Remet le focus sur le champ montant
 * après une erreur de validation.
 */
function focusAmountAgain(){
  setTimeout(() => {
    try{
      inputAmount.focus({ preventScroll: true });
    }catch(_){}
  }, 60);
}

/* ============================================================
   ÉVÉNEMENTS AJOUT
   ============================================================ */
btnAdd.addEventListener(
  "click",
  function(){
    openAddModal();
  }
);

wizCancel.addEventListener(
  "click",
  function(){
    closeAddModal();
  }
);

wizNext.addEventListener(
  "click",
  function(){
    addCredit();
  }
);

inputAmount.addEventListener(
  "keydown",
  function(event){
    if(event.key === "Enter"){
      event.preventDefault();
      addCredit();
    }

    if(event.key === "Escape"){
      event.preventDefault();
      closeAddModal();
    }
  }
);

/*
 * Clic sur le fond = fermeture.
 */
modalWizard.addEventListener(
  "click",
  function(event){
    if(event.target === modalWizard){
      closeAddModal();
    }
  }
);

/* ============================================================
   HISTORIQUE
   ============================================================ */
function renderHistory(){
  historyGroups.innerHTML = "";

  if(state.history.length === 0){
    historyTotal.classList.add("hidden");
    emptyHistory.classList.remove("hidden");
    return;
  }

  emptyHistory.classList.add("hidden");
  historyTotal.classList.remove("hidden");

  const historyTotalAmount = state.history.reduce(
    (sum,item) => sum + Number(item.amount),
    0
  );

  historyTotalValue.textContent = price(historyTotalAmount);

  historyCount.textContent =
    state.history.length +
    (
      state.history.length > 1
        ? " règlements"
        : " règlement"
    );

  const groups = new Map();

  const sorted = [...state.history].sort(
    (a,b) =>
      new Date(b.paidAt) -
      new Date(a.paidAt)
  );

  for(const item of sorted){
    const key = dateKey(item.paidAt);

    if(!groups.has(key)){
      groups.set(key,[]);
    }

    groups.get(key).push(item);
  }

  for(const items of groups.values()){
    const group = document.createElement("div");
    group.className = "history-group";

    const header = document.createElement("div");
    header.className = "history-day";

    const title = document.createElement("span");
    title.textContent = longDate(items[0].paidAt);

    const dayTotal = items.reduce(
      (sum,item) => sum + Number(item.amount),
      0
    );

    const summary = document.createElement("span");
    summary.textContent =
      items.length +
      " · " +
      price(dayTotal);

    header.append(
      title,
      summary
    );

    const card = document.createElement("div");
    card.className = "history-card";

    for(const item of items){
      const row = document.createElement("div");
      row.className = "history-row";

      const line = document.createElement("div");
      line.className = "history-line";

      const icon = document.createElement("div");
      icon.className = "history-icon";
      icon.textContent = "✓";

      const info = document.createElement("div");
      info.className = "history-info";
      info.textContent =
        "Ajout " +
        shortDate(item.createdAt) +
        " " +
        time(item.createdAt) +
        " → Réglé " +
        time(item.paidAt);

      const amount = document.createElement("div");
      amount.className = "history-amount";
      amount.textContent = price(item.amount);

      line.append(
        icon,
        info,
        amount
      );

      row.appendChild(line);
      card.appendChild(row);
    }

    group.append(
      header,
      card
    );

    historyGroups.appendChild(group);
  }
}

/* ============================================================
   NAVIGATION HISTORIQUE
   ============================================================ */
btnHistory.addEventListener(
  "click",
  function(){
    renderHistory();
    historyView.classList.remove("hidden");
  }
);

btnBack.addEventListener(
  "click",
  function(){
    historyView.classList.add("hidden");
  }
);

/* ============================================================
   CONFIRMATION
   ============================================================ */
function openConfirm(
  title,
  message,
  callback
){
  modalTitle.textContent = title;
  modalText.textContent = message;
  confirmAction = callback;

  modalConfirm.classList.add("open");
  modalConfirm.setAttribute(
    "aria-hidden",
    "false"
  );
}

function closeConfirm(){
  modalConfirm.classList.remove("open");
  modalConfirm.setAttribute(
    "aria-hidden",
    "true"
  );

  confirmAction = null;
}

modalCancel.addEventListener(
  "click",
  closeConfirm
);

modalOk.addEventListener(
  "click",
  function(){
    const callback = confirmAction;

    closeConfirm();

    if(typeof callback === "function"){
      callback();
    }
  }
);

modalConfirm.addEventListener(
  "click",
  function(event){
    if(event.target === modalConfirm){
      closeConfirm();
    }
  }
);

/* ============================================================
   RÉGLER TOUT
   ============================================================ */
function payAll(){
  if(state.credits.length === 0){
    return;
  }

  const total = totalCredits();
  const now = new Date().toISOString();

  for(const credit of state.credits){
    state.history.unshift({
      ...credit,
      paidAt:now
    });
  }

  state.credits = [];

  if(
    state.history.length >
    CONFIG.historyLimit
  ){
    state.history = state.history.slice(
      0,
      CONFIG.historyLimit
    );
  }

  save();
  renderCredits();
  renderHistory();

  haptic([10,40,20]);
  showToast(
    "Tout est réglé ✓ " +
    price(total)
  );
}

/* ============================================================
   TOTAL → RÉGLER
   ============================================================ */
totalBanner.addEventListener(
  "click",
  function(){
    const count = state.credits.length;
    const total = totalCredits();

    openConfirm(
      "Tout régler ?",
      count +
      (
        count > 1
          ? " crédits"
          : " crédit"
      ) +
      " pour un total de " +
      price(total) +
      ".",
      payAll
    );
  }
);

/* ============================================================
   EFFACER HISTORIQUE
   ============================================================ */
btnClearHistory.addEventListener(
  "click",
  function(){
    if(state.history.length === 0){
      showToast(
        "Historique déjà vide"
      );
      return;
    }

    openConfirm(
      "Effacer tout ?",
      "Tout l'historique sera supprimé définitivement.",
      function(){
        state.history = [];

        save();
        renderHistory();

        haptic([10,40,20]);
        showToast(
          "Historique effacé"
        );
      }
    );
  }
);

/* ============================================================
   ESCAPE
   ============================================================ */
document.addEventListener(
  "keydown",
  function(event){
    if(event.key !== "Escape"){
      return;
    }

    if(modalConfirm.classList.contains("open")){
      closeConfirm();
      return;
    }

    if(modalWizard.classList.contains("open")){
      closeAddModal();
      return;
    }

    if(!historyView.classList.contains("hidden")){
      historyView.classList.add("hidden");
    }
  }
);

/* ============================================================
   INITIALISATION
   ============================================================ */
load();
renderCredits();
renderHistory();
</script>
