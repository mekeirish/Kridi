<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Crédits</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
:root{
  /* Palette : ardoise profonde + émeraude + cyan + ambre */
  --bg:#0a0f1c;
  --bg-soft:#0f1626;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.07);
  --surface-3:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);

  --emerald:#10b981;
  --emerald-soft:#34d399;
  --cyan:#22d3ee;
  --cyan-soft:#67e8f9;
  --amber:#fbbf24;
  --rose:#fb7185;
  --rose-deep:#e11d48;

  --text:#f1f5f9;
  --text-soft:rgba(241,245,249,.72);
  --text-mute:rgba(241,245,249,.48);
  --text-faint:rgba(241,245,249,.32);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  letter-spacing:-.01em;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

/* ============================================================
   BACKGROUND — subtil, élégant, sans gros dégradés flashy
   ============================================================ */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(900px 600px at 12% -8%,rgba(16,185,129,.10),transparent 65%),
    radial-gradient(900px 600px at 92% 8%,rgba(34,211,238,.075),transparent 65%),
    radial-gradient(700px 500px at 50% 110%,rgba(251,191,36,.045),transparent 70%),
    linear-gradient(180deg,#0a0f1c 0%,#0b1220 60%,#0a0f1c 100%);
}

/* Grain subtil */
.background::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:24px 24px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
}

/* ============================================================
   APP
   ============================================================ */
#app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 18px 170px 18px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.logo{
  width:50px;
  height:50px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:linear-gradient(140deg,#0f766e,#0891b2);
  box-shadow:
    0 10px 28px -8px rgba(6,182,212,.35),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.2);
  position:relative;
  overflow:hidden;
}

.logo::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(120% 100% at 20% 0%,rgba(255,255,255,.28),transparent 55%);
}

.logo span{
  font-size:24px;
  font-weight:800;
  color:#ecfeff;
  position:relative;
  z-index:1;
  text-shadow:0 1px 2px rgba(0,0,0,.25);
}

.brand-title{
  margin:0;
  font-size:23px;
  line-height:1.05;
  font-weight:800;
  color:#f0fdfa;
  letter-spacing:-.02em;
}

.brand-subtitle{
  margin-top:4px;
  color:var(--text-mute);
  font-size:11.5px;
  letter-spacing:.01em;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:14px;
  color:#fff;
  font-size:14px;
  font-weight:700;
  transition:transform .12s ease,background .18s ease,border-color .18s ease;
  letter-spacing:-.005em;
}

.btn:active{
  transform:scale(.97);
}

.btn-history{
  padding:0 14px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-soft);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.btn-history:active{
  background:var(--surface-2);
}

.btn-add{
  width:100%;
  margin-bottom:18px;
  padding:18px;
  border-radius:20px;
  font-size:16px;
  font-weight:800;
  color:#052e2b;
  background:linear-gradient(180deg,#34d399,#10b981);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 14px 34px -12px rgba(16,185,129,.55),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.1);
  position:relative;
  overflow:hidden;
}

.btn-add::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.28),transparent 55%);
  pointer-events:none;
}

.btn-add:active{
  transform:scale(.985);
  filter:brightness(.96);
}

.btn-primary{
  flex:1;
  background:linear-gradient(180deg,#22d3ee,#0891b2);
  color:#042f2e;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 10px 24px -10px rgba(34,211,238,.5),
    inset 0 1px 0 rgba(255,255,255,.35);
}

.btn-secondary{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border-strong);
  color:var(--text);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.btn-secondary:active{
  background:var(--surface-2);
}

.btn-danger{
  background:linear-gradient(180deg,#fb7185,#e11d48);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    0 10px 24px -10px rgba(225,29,72,.5),
    inset 0 1px 0 rgba(255,255,255,.22);
  padding:0 14px;
}

/* ============================================================
   CREDITS
   ============================================================ */
#listCredits{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.credit{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 18px;
  border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:
    0 12px 30px -18px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.06);
  animation:appear .25s ease-out;
}

.credit-icon{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  color:#fcd34d;
  background:rgba(251,191,36,.10);
  border:1px solid rgba(251,191,36,.22);
  font-size:17px;
  font-weight:800;
}

.credit-info{
  flex:1;
  min-width:0;
}

.credit-date{
  color:var(--text-faint);
  font-size:11px;
  letter-spacing:.01em;
}

.credit-amount{
  flex:none;
  font-size:22px;
  font-weight:800;
  color:#f0fdfa;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   EMPTY
   ============================================================ */
#emptyMsg{
  text-align:center;
  margin-top:80px;
  color:var(--text-mute);
  font-size:16px;
  line-height:1.75;
  letter-spacing:-.005em;
}

#emptyMsg strong{
  color:var(--emerald-soft);
  font-weight:700;
}

/* ============================================================
   TOTAL BANNER
   ============================================================ */
#totalBanner{
  position:fixed;
  left:50%;
  bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:20;
  width:min(620px,100%);
  padding:0 16px;
  transform:translateX(-50%);
  background:none;
}

.total-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:18px 20px;
  border-radius:22px;
  background:linear-gradient(160deg,rgba(225,29,72,.94),rgba(190,18,60,.94));
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:
    0 22px 45px -18px rgba(225,29,72,.55),
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(0,0,0,.15);
  position:relative;
  overflow:hidden;
}

.total-inner::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.18),transparent 60%);
  pointer-events:none;
}

.total-label{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.6px;
  color:rgba(255,255,255,.85);
}

.total-count{
  margin-top:5px;
  font-size:11.5px;
  color:rgba(255,255,255,.72);
}

.total-hint{
  margin-top:4px;
  font-size:9.5px;
  color:rgba(255,255,255,.55);
  font-style:italic;
}

.total-value{
  font-size:30px;
  font-weight:800;
  white-space:nowrap;
  color:#fff;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 6px rgba(0,0,0,.2);
}

/* ============================================================
   FULLSCREEN VIEWS
   ============================================================ */
.fullscreen{
  position:fixed;
  inset:0;
  z-index:30;
  overflow-y:auto;
  background:var(--bg);
}

.view-inner{
  width:100%;
  max-width:620px;
  min-height:100%;
  margin:auto;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
}

/* ============================================================
   HISTORY
   ============================================================ */
.history-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:24px;
}

.history-title{
  font-size:20px;
  font-weight:800;
  color:#f0fdfa;
  letter-spacing:-.02em;
}

.history-total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  margin-bottom:22px;
  border-radius:20px;
  background:linear-gradient(160deg,rgba(16,185,129,.08),rgba(34,211,238,.04));
  border:1px solid rgba(16,185,129,.15);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}

.history-total-label{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.4px;
  color:var(--text-soft);
}

.history-total-count{
  margin-top:5px;
  font-size:11px;
  color:var(--text-faint);
}

.history-total-value{
  font-size:24px;
  font-weight:800;
  color:var(--emerald-soft);
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   SESSIONS DE RÈGLEMENT
   ============================================================ */
#sessionList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.session{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 18px;
  border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:
    0 12px 30px -18px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.06);
  text-align:left;
  width:100%;
  color:var(--text);
  font-family:inherit;
  transition:transform .12s ease,border-color .18s ease,background .18s ease;
  animation:appear .25s ease-out;
}

.session:active{
  transform:scale(.985);
  border-color:rgba(34,211,238,.35);
  background:linear-gradient(160deg,rgba(34,211,238,.08),rgba(255,255,255,.03));
}

.session-icon{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  color:var(--emerald-soft);
  background:rgba(16,185,129,.10);
  border:1px solid rgba(16,185,129,.22);
  font-size:17px;
  font-weight:800;
}

.session-info{
  flex:1;
  min-width:0;
}

.session-date{
  font-size:14px;
  font-weight:700;
  color:#f0fdfa;
  line-height:1.25;
  letter-spacing:-.01em;
}

.session-time{
  margin-top:3px;
  font-size:11px;
  color:var(--text-mute);
}

.session-count{
  margin-top:4px;
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:.02em;
}

.session-amount{
  flex:none;
  font-size:19px;
  font-weight:800;
  color:#f0fdfa;
  text-align:right;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}

.session-chevron{
  flex:none;
  font-size:20px;
  color:var(--text-faint);
  margin-left:2px;
  line-height:1;
  transition:color .18s ease;
}

.session:active .session-chevron{
  color:var(--cyan);
}

.empty-history{
  text-align:center;
  margin-top:80px;
  color:var(--text-mute);
  font-size:16px;
}

/* ============================================================
   MODALES — glassmorphisme raffiné
   ============================================================ */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(6,10,20,.72);
  backdrop-filter:blur(8px) saturate(140%);
  -webkit-backdrop-filter:blur(8px) saturate(140%);
}

.modal.open{
  display:flex;
  animation:modalFade .18s ease-out;
}

.modal-card{
  width:100%;
  max-width:400px;
  max-height:calc(100vh - 60px);
  display:flex;
  flex-direction:column;
  padding:24px;
  border-radius:24px;
  background:linear-gradient(165deg,rgba(20,28,45,.96),rgba(12,18,32,.96));
  border:1px solid var(--border-strong);
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  box-shadow:
    0 40px 80px -30px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(0,0,0,.3);
  animation:modalIn .26s cubic-bezier(.2,.9,.3,1.2);
  position:relative;
  overflow:hidden;
}

.modal-card::before{
  content:"";
  position:absolute;
  top:-60%;
  left:-20%;
  right:-20%;
  height:60%;
  background:radial-gradient(closest-side,rgba(34,211,238,.10),transparent);
  pointer-events:none;
}

/* ============================================================
   ADD MODAL
   ============================================================ */
.add-icon{
  width:56px;
  height:56px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(140deg,#0f766e,#0891b2);
  color:#ecfeff;
  font-size:26px;
  font-weight:400;
  box-shadow:
    0 12px 30px -10px rgba(6,182,212,.5),
    inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
  z-index:1;
}

.modal-title{
  margin:0;
  text-align:center;
  font-size:23px;
  font-weight:800;
  color:#f0fdfa;
  letter-spacing:-.02em;
  position:relative;
  z-index:1;
}

.modal-subtitle{
  margin:7px 0 20px;
  text-align:center;
  color:var(--text-mute);
  font-size:13px;
  position:relative;
  z-index:1;
}

.amount-wrap{
  position:relative;
  margin-bottom:18px;
  z-index:1;
}

.amount-input{
  display:block;
  width:100%;
  height:76px;
  padding:0 54px 0 18px;
  border-radius:18px;
  border:1.5px solid var(--border-strong);
  outline:none;
  background:rgba(6,10,20,.6);
  color:#fff;
  font-size:34px;
  font-weight:800;
  text-align:center;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}

.amount-input::placeholder{
  color:var(--text-faint);
  font-weight:700;
}

.amount-input:focus{
  border-color:rgba(34,211,238,.55);
  background:rgba(6,10,20,.85);
  box-shadow:
    0 0 0 4px rgba(34,211,238,.12),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.amount-euro{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-mute);
  font-size:22px;
  font-weight:700;
  pointer-events:none;
}

.modal-buttons{
  display:flex;
  gap:10px;
  position:relative;
  z-index:1;
}

/* ============================================================
   CONFIRM
   ============================================================ */
.confirm-text{
  margin:10px 0 24px;
  text-align:center;
  color:var(--text-soft);
  font-size:14.5px;
  line-height:1.55;
  position:relative;
  z-index:1;
}

/* ============================================================
   SESSION DETAIL MODAL
   ============================================================ */
.session-modal-header{
  margin-bottom:18px;
  text-align:center;
  position:relative;
  z-index:1;
}

.session-modal-icon{
  width:54px;
  height:54px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  color:var(--emerald-soft);
  background:linear-gradient(140deg,rgba(16,185,129,.18),rgba(16,185,129,.06));
  border:1px solid rgba(16,185,129,.30);
  font-size:24px;
  font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}

.session-modal-title{
  margin:0;
  font-size:19px;
  font-weight:800;
  color:#f0fdfa;
  letter-spacing:-.02em;
}

.session-modal-subtitle{
  margin-top:5px;
  font-size:12px;
  color:var(--text-mute);
}

.session-modal-total{
  margin-top:12px;
  font-size:26px;
  font-weight:800;
  color:var(--emerald-soft);
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}

.session-modal-list{
  flex:1;
  overflow-y:auto;
  margin:0 -6px 18px;
  padding:0 6px;
  max-height:42vh;
  position:relative;
  z-index:1;
}

.session-modal-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  border-radius:15px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
  margin-bottom:8px;
  transition:background .18s ease;
}

.session-modal-item:hover{
  background:rgba(255,255,255,.05);
}

.session-modal-item:last-child{
  margin-bottom:0;
}

.session-modal-item-icon{
  width:34px;
  height:34px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  color:#fcd34d;
  background:rgba(251,191,36,.10);
  border:1px solid rgba(251,191,36,.20);
  font-size:14px;
  font-weight:800;
}

.session-modal-item-info{
  flex:1;
  min-width:0;
}

.session-modal-item-date{
  font-size:10.5px;
  color:var(--text-faint);
  letter-spacing:.01em;
}

.session-modal-item-amount{
  font-size:16px;
  font-weight:800;
  flex:none;
  color:#f0fdfa;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;
  left:50%;
  bottom:120px;
  z-index:200;
  transform:translateX(-50%) translateY(8px);
  display:none;
  max-width:calc(100% - 32px);
  padding:14px 22px;
  border-radius:16px;
  background:linear-gradient(160deg,rgba(20,28,45,.96),rgba(12,18,32,.96));
  border:1px solid var(--border-strong);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:
    0 20px 45px -15px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.08);
  color:#f0fdfa;
  font-size:14px;

     TOAST
     ============================================================ -->
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  storageKey:"mesCredits_final",
  historyLimit:500,
  minAmount:0.01,
  maxAmount:999999.99
};

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);

const btnAdd = $("btnAdd");
const btnHistory = $("btnHistory");
const btnBack = $("btnBack");

const listCredits = $("listCredits");
const emptyMsg = $("emptyMsg");

const totalBanner = $("totalBanner");
const totalValue = $("totalValue");
const totalCount = $("totalCount");

const historyView = $("historyView");
const sessionList = $("sessionList");
const emptyHistory = $("emptyHistory");
const historyTotal = $("historyTotal");
const historyTotalValue = $("historyTotalValue");
const historyCount = $("historyCount");
const btnClearHistory = $("btnClearHistory");

const modalWizard = $("modalWizard");
const inputAmount = $("inputAmount");
const wizNext = $("wizNext");
const wizCancel = $("wizCancel");

const modalConfirm = $("modalConfirm");
const modalTitle = $("modalTitle");
const modalText = $("modalText");
const modalOk = $("modalOk");
const modalCancel = $("modalCancel");

const modalSession = $("modalSession");
const sessionModalDate = $("sessionModalDate");
const sessionModalTime = $("sessionModalTime");
const sessionModalTotal = $("sessionModalTotal");
const sessionModalList = $("sessionModalList");
const sessionModalClose = $("sessionModalClose");

const toast = $("toast");

/* ============================================================
   ÉTAT
   ============================================================ */
let state = {
  credits:[],
  sessions:[]
};

let confirmAction = null;

/* ============================================================
   HAPTIC
   ============================================================ */
function haptic(pattern){
  if(!navigator.vibrate){
    return;
  }
  try{
    navigator.vibrate(pattern || 10);
  }catch(_){}
}

/* ============================================================
   STORAGE
   ============================================================ */
function validCredit(item){
  return (
    item &&
    typeof item.id === "string" &&
    Number.isFinite(Number(item.amount)) &&
    Number(item.amount) > 0
  );
}

function validSession(item){
  return (
    item &&
    typeof item.id === "string" &&
    typeof item.paidAt === "string" &&
    Array.isArray(item.credits)
  );
}

function migrateHistoryToSessions(history){
  const map = new Map();

  for(const item of history){
    if(!validCredit(item) || !item.paidAt){
      continue;
    }

    const key = item.paidAt;

    if(!map.has(key)){
      map.set(key,{
        id:uid(),
        paidAt:item.paidAt,
        credits:[]
      });
    }

    map.get(key).credits.push({
      id:item.id,
      amount:Number(item.amount),
      createdAt:item.createdAt
    });
  }

  return [...map.values()].sort(
    (a,b) => new Date(b.paidAt) - new Date(a.paidAt)
  );
}

function load(){
  try{
    const raw = localStorage.getItem(CONFIG.storageKey);

    if(!raw){
      return;
    }

    const data = JSON.parse(raw);

    if(!data || typeof data !== "object"){
      return;
    }

    if(Array.isArray(data.credits)){
      state.credits = data.credits
        .filter(validCredit)
        .map(item => ({
          ...item,
          amount:Number(item.amount)
        }));
    }

    if(Array.isArray(data.sessions)){
      state.sessions = data.sessions
        .filter(validSession)
        .slice(0,CONFIG.historyLimit)
        .map(session => ({
          id:session.id,
          paidAt:session.paidAt,
          credits:session.credits
            .filter(validCredit)
            .map(c => ({
              id:c.id,
              amount:Number(c.amount),
              createdAt:c.createdAt
            }))
        }));

    }else if(Array.isArray(data.history)){
      state.sessions = migrateHistoryToSessions(data.history)
        .slice(0,CONFIG.historyLimit);
    }

  }catch(error){
    console.error(
      "Erreur de lecture:",
      error
    );

    state = {
      credits:[],
      sessions:[]
    };
  }
}

function save(){
  try{
    localStorage.setItem(
      CONFIG.storageKey,
      JSON.stringify({
        credits:state.credits,
        sessions:state.sessions
      })
    );

    return true;

  }catch(error){
    console.error(
      "Erreur localStorage:",
      error
    );

    showToast(
      "Impossible de sauvegarder"
    );

    return false;
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function uid(){
  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,9)
  );
}

function price(value){
  return Number(value || 0)
    .toLocaleString(
      "fr-FR",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    ) + " €";
}

function amountFromInput(value){
  if(typeof value !== "string"){
    return NaN;
  }

  let text = value
    .trim()
    .replace(/\s/g,"")
    .replace(/€/g,"");

  if(!text){
    return NaN;
  }

  if(text.includes(",")){
    text = text
      .replace(/\./g,"")
      .replace(",",".");
  }

  const number = Number(text);

  if(!Number.isFinite(number)){
    return NaN;
  }

  return Math.round(number * 100) / 100;
}

function shortDate(iso){
  const date = new Date(iso);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleDateString(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"2-digit"
    }
  );
}

function time(iso){
  const date = new Date(iso);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleTimeString(
    "fr-FR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function longDate(iso){
  const d = new Date(iso);
  const today = new Date();
  const yesterday = new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );

  const sameDay = (a,b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  if(sameDay(d,today)){
    return "Aujourd'hui";
  }

  if(sameDay(d,yesterday)){
    return "Hier";
  }

  return d.toLocaleDateString(
    "fr-FR",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );
}

function sessionTotal(session){
  return session.credits.reduce(
    (sum,c) => sum + Number(c.amount),
    0
  );
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(
    () => toast.classList.remove("show"),
    1800
  );
}

/* ============================================================
   RENDU CRÉDITS
   ============================================================ */
function renderCredits(){
  listCredits.innerHTML = "";

  for(const credit of state.credits){
    const li = document.createElement("li");
    li.className = "credit";

    const icon = document.createElement("div");
    icon.className = "credit-icon";
    icon.textContent = "€";

    const info = document.createElement("div");
    info.className = "credit-info";

    const date = document.createElement("div");
    date.className = "credit-date";
    date.textContent =
      "Ajouté le " +
      shortDate(credit.createdAt) +
      " à " +
      time(credit.createdAt);

    info.appendChild(date);

    const amount = document.createElement("div");
    amount.className = "credit-amount";
    amount.textContent = price(credit.amount);

    li.append(
      icon,
      info,
      amount
    );

    listCredits.appendChild(li);
  }

  emptyMsg.classList.toggle(
    "hidden",
    state.credits.length !== 0
  );

  renderTotal();
}

/* ============================================================
   TOTAL EN ATTENTE
   ============================================================ */
function totalCredits(){
  return state.credits.reduce(
    (sum,item) => sum + Number(item.amount),
    0
  );
}

function renderTotal(){
  if(state.credits.length === 0){
    totalBanner.classList.add("hidden");
    return;
  }

  totalBanner.classList.remove("hidden");

  totalValue.textContent = price(totalCredits());

  totalCount.textContent =
    state.credits.length +
    (
      state.credits.length > 1
        ? " crédits en attente"
        : " crédit en attente"
    );
}

/* ============================================================
   MODALE AJOUT
   ============================================================ */
function openAddModal(){
  inputAmount.value = "";

  modalWizard.classList.add("open");
  modalWizard.setAttribute(
    "aria-hidden",
    "false"
  );

  haptic(18);

  let focused = false;

  const doFocus = () => {
    if(focused){
      return;
    }
    focused = true;

    try{
      inputAmount.focus({ preventScroll: true });
    }catch(_){
      try{
        inputAmount.focus();
      }catch(__){}
    }
  };

  requestAnimationFrame(() => {
    requestAnimationFrame(doFocus);
  });

  setTimeout(doFocus, 120);
}

function closeAddModal(){
  if(document.activeElement === inputAmount){
    try{
      inputAmount.blur();
    }catch(_){}
  }

  modalWizard.classList.remove("open");
  modalWizard.setAttribute(
    "aria-hidden",
    "true"
  );

  inputAmount.value = "";
}

/* ============================================================
   AJOUT CRÉDIT
   ============================================================ */
function addCredit(){
  const amount = amountFromInput(
    inputAmount.value
  );

  if(!Number.isFinite(amount)){
    haptic([30,50,30]);
    showToast(
      "Entre un montant valide"
    );
    focusAmountAgain();
    return;
  }

  if(amount < CONFIG.minAmount){
    haptic([30,50,30]);
    showToast(
      "Le montant doit être supérieur à 0"
    );
    focusAmountAgain();
    return;
  }

  if(amount > CONFIG.maxAmount){
    haptic([30,50,30]);
    showToast(
      "Montant trop élevé"
    );
    focusAmountAgain();
    return;
  }

  const credit = {
    id:uid(),
    amount:amount,
    createdAt:new Date().toISOString()
  };

  state.credits.unshift(credit);

  closeAddModal();
  save();
  renderCredits();

  haptic([10,40,20]);
  showToast(
    "Crédit ajouté ✓ " +
    price(amount)
  );
}

function focusAmountAgain(){
  setTimeout(() => {
    try{
      inputAmount.focus({ preventScroll: true });
    }catch(_){}
  }, 60);
}

/* ============================================================
   ÉVÉNEMENTS AJOUT
   ============================================================ */
btnAdd.addEventListener(
  "click",
  function(){
    openAddModal();
  }
);

wizCancel.addEventListener(
  "click",
  function(){
    closeAddModal();
  }
);

wizNext.addEventListener(
  "click",
  function(){
    addCredit();
  }
);

inputAmount.addEventListener(
  "keydown",
  function(event){
    if(event.key === "Enter"){
      event.preventDefault();
      addCredit();
    }

    if(event.key === "Escape"){
      event.preventDefault();
      closeAddModal();
    }
  }
);

modalWizard.addEventListener(
  "click",
  function(event){
    if(event.target === modalWizard){
      closeAddModal();
    }
  }
);

/* ============================================================
   HISTORIQUE : LISTE DES SESSIONS
   ============================================================ */
function renderHistory(){
  sessionList.innerHTML = "";

  if(state.sessions.length === 0){
    historyTotal.classList.add("hidden");
    emptyHistory.classList.remove("hidden");
    return;
  }

  emptyHistory.classList.add("hidden");
  historyTotal.classList.remove("hidden");

  const grandTotal = state.sessions.reduce(
    (sum,s) => sum + sessionTotal(s),
    0
  );

  const totalItems = state.sessions.reduce(
    (sum,s) => sum + s.credits.length,
    0
  );

  historyTotalValue.textContent = price(grandTotal);

  historyCount.textContent =
    state.sessions.length +
    (
      state.sessions.length > 1
        ? " règlements · "
        : " règlement · "
    ) +
    totalItems +
    (
      totalItems > 1
        ? " crédits"
        : " crédit"
    );

  const sorted = [...state.sessions].sort(
    (a,b) => new Date(b.paidAt) - new Date(a.paidAt)
  );

  for(const session of sorted){
    const count = session.credits.length;
    const total = sessionTotal(session);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "session";
    btn.setAttribute(
      "aria-label",
      "Voir le détail du règlement du " +
      shortDate(session.paidAt) +
      " à " +
      time(session.paidAt)
    );

    const icon = document.createElement("div");
    icon.className = "session-icon";
    icon.textContent = "✓";

    const info = document.createElement("div");
    info.className = "session-info";

    const dateEl = document.createElement("div");
    dateEl.className = "session-date";
    dateEl.textContent = longDate(session.paidAt);

    const timeEl = document.createElement("div");
    timeEl.className = "session-time";
    timeEl.textContent = "à " + time(session.paidAt);

    const countEl = document.createElement("div");
    countEl.className = "session-count";
    countEl.textContent =
      count +
      (
        count > 1
          ? " crédits réglés"
          : " crédit réglé"
      );

    info.append(
      dateEl,
      timeEl,
      countEl
    );

    const amount = document.createElement("div");
    amount.className = "session-amount";
    amount.textContent = price(total);

    const chevron = document.createElement("div");
    chevron.className = "session-chevron";
    chevron.textContent = "›";

    btn.append(
      icon,
      info,
      amount,
      chevron
    );

    btn.addEventListener(
      "click",
      function(){
        haptic(12);
        openSessionModal(session);
      }
    );

    sessionList.appendChild(btn);
  }
}

/* ============================================================
   MODALE DÉTAIL SESSION
   ============================================================ */
function openSessionModal(session){
  sessionModalDate.textContent = longDate(session.paidAt);
  sessionModalTime.textContent = "à " + time(session.paidAt);
  sessionModalTotal.textContent = price(sessionTotal(session));

  sessionModalList.innerHTML = "";

  const credits = [...session.credits].sort(
    (a,b) => new Date(b.createdAt) - new Date(a.createdAt)
  );

  for(const credit of credits){
    const item = document.createElement("div");
    item.className = "session-modal-item";

    const icon = document.createElement("div");
    icon.className = "session-modal-item-icon";
    icon.textContent = "€";

    const info = document.createElement("div");
    info.className = "session-modal-item-info";

    const dateEl = document.createElement("div");
    dateEl.className = "session-modal-item-date";
    dateEl.textContent =
      "Ajouté le " +
      shortDate(credit.createdAt) +
      " à " +
      time(credit.createdAt);

    info.appendChild(dateEl);

    const amount = document.createElement("div");
    amount.className = "session-modal-item-amount";
    amount.textContent = price(credit.amount);

    item.append(
      icon,
      info,
      amount
    );

    sessionModalList.appendChild(item);
  }

  modalSession.classList.add("open");
  modalSession.setAttribute(
    "aria-hidden",
    "false"
  );
}

function closeSessionModal(){
  modalSession.classList.remove("open");
  modalSession.setAttribute(
    "aria-hidden",
    "true"
  );
}

sessionModalClose.addEventListener(
  "click",
  function(){
    haptic(10);
    closeSessionModal();
  }
);

modalSession.addEventListener(
  "click",
  function(event){
    if(event.target === modalSession){
      closeSessionModal();
    }
  }
);

/* ============================================================
   NAVIGATION HISTORIQUE
   ============================================================ */
btnHistory.addEventListener(
  "click",
  function(){
    renderHistory();
    historyView.classList.remove("hidden");
  }
);

btnBack.addEventListener(
  "click",
  function(){
    historyView.classList.add("hidden");
  }
);

/* ============================================================
   CONFIRMATION
   ============================================================ */
function openConfirm(
  title,
  message,
  callback
){
  modalTitle.textContent = title;
  modalText.textContent = message;
  confirmAction = callback;

  modalConfirm.classList.add("open");
  modalConfirm.setAttribute(
    "aria-hidden",
    "false"
  );
}

function closeConfirm(){
  modalConfirm.classList.remove("open");
  modalConfirm.setAttribute(
    "aria-hidden",
    "true"
  );

  confirmAction = null;
}

modalCancel.addEventListener(
  "click",
  closeConfirm
);

modalOk.addEventListener(
  "click",
  function(){
    const callback = confirmAction;

    closeConfirm();

    if(typeof callback === "function"){
      callback();
    }
  }
);

modalConfirm.addEventListener(
  "click",
  function(event){
    if(event.target === modalConfirm){
      closeConfirm();
    }
  }
);

/* ============================================================
   RÉGLER TOUT
   ============================================================ */
function payAll(){
  if(state.credits.length === 0){
    return;
  }

  const total = totalCredits();
  const now = new Date().toISOString();

  const session = {
    id:uid(),
    paidAt:now,
    credits:state.credits.map(c => ({
      id:c.id,
      amount:Number(c.amount),
      createdAt:c.createdAt
    }))
  };

  state.sessions.unshift(session);
  state.credits = [];

  if(state.sessions.length > CONFIG.historyLimit){
    state.sessions = state.sessions.slice(
      0,
      CONFIG.historyLimit
    );
  }

  save();
  renderCredits();
  renderHistory();

  haptic([10,40,20]);
  showToast(
    "Tout est réglé ✓ " +
    price(total)
  );
}

/* ============================================================
   TOTAL → RÉGLER
   ============================================================ */
totalBanner.addEventListener(
  "click",
  function(){
    const count = state.credits.length;
    const total = totalCredits();

    openConfirm(
      "Tout régler ?",
      count +
      (
        count > 1
          ? " crédits"
          : " crédit"
      ) +
      " pour un total de " +
      price(total) +
      ".",
      payAll
    );
  }
);

/* ============================================================
   EFFACER HISTORIQUE
   ============================================================ */
btnClearHistory.addEventListener(
  "click",
  function(){
    if(state.sessions.length === 0){
      showToast(
        "Historique déjà vide"
      );
      return;
    }

    openConfirm(
      "Effacer tout ?",
      "Tout l'historique sera supprimé définitivement.",
      function(){
        state.sessions = [];

        save();
        renderHistory();

        haptic([10,40,20]);
        showToast(
          "Historique effacé"
        );
      }
    );
  }
);

/* ============================================================
   ESCAPE
   ============================================================ */
document.addEventListener(
  "keydown",
  function(event){
    if(event.key !== "Escape"){
      return;
    }

    if(modalSession.classList.contains("open")){
      closeSessionModal();
      return;
    }

    if(modalConfirm.classList.contains("open")){
      closeConfirm();
      return;
    }

    if(modalWizard.classList.contains("open")){
      closeAddModal();
      return;
    }

    if(!historyView.classList.contains("hidden")){
      historyView.classList.add("hidden");
    }
  }
);

/* ============================================================
   INITIALISATION
   ============================================================ */
load();
renderCredits();
renderHistory();
</script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
